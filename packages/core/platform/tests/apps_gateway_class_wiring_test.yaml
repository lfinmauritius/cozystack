suite: apps.yaml gateway.className / gateway.edgeTerminatedClasses → _cluster wiring
templates:
  - templates/apps.yaml

release:
  name: cozy-platform
  namespace: cozy-system

# gateway.className names the GatewayClass a tenant Gateway uses when the
# tenant picks none, and gateway.edgeTerminatedClasses names the classes whose
# provider terminates TLS upstream — a property of the class, so a tenant that
# selects one gets edge behaviour without stating it separately. Both reach the
# per-tenant gateway chart only through the _cluster keys in the
# cozystack-values Secret; without these pins a platform-level change would
# silently never arrive.

tests:
  - it: writes the cilium default class and an empty edge list by default
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-class-name:\s*"cilium"'
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-edge-classes:\s*""'

  # The chart's own default is the string "cilium", so every other case
  # here reaches the kind check with a string. Nulling the key is the one
  # way to reach it with no value at all, and the documented fallback for
  # an unmade choice is the bundled class — not the refusal a bare kind
  # check would raise on nil.
  - it: falls back to the bundled class when the key is explicitly unset
    set:
      gateway:
        className: null
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-class-name:\s*"cilium"'

  - it: writes the configured default class and the edge-terminated list
    set:
      gateway:
        className: cloudflare-tunnel
        edgeTerminatedClasses:
          - cloudflare-tunnel
          - some-other-tunnel
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-class-name:\s*"cloudflare-tunnel"'
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-edge-classes:\s*"cloudflare-tunnel,some-other-tunnel"'

  - it: normalises a padded default class before it reaches either reader
    set:
      gateway:
        className: "  cloudflare-tunnel  "
        edgeTerminatedClasses:
          - cloudflare-tunnel
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-class-name:\s*"cloudflare-tunnel"'

  - it: refuses a whitespace-only default rather than resolving it quietly
    set:
      gateway:
        className: "   "
    asserts:
      - failedTemplate:
          errorMessage: 'gateway.className is only whitespace. Leave it unset to use the bundled cilium class, or name a real GatewayClass — resolving a blank value silently would decide TLS termination for every tenant that did not choose.'

  - it: rejects a non-string default class by name
    set:
      gateway:
        className: 123
    asserts:
      - failedTemplate:
          errorMessage: 'gateway.className must be a GatewayClass name, got 123'

  # 0 and false are the falsy non-strings. A `default ""` placed ahead of
  # the kind check would turn both into the empty string and resolve them
  # to the bundled class, so these two pin the ORDER of the guard, not
  # just its presence.
  - it: rejects a zero default class rather than treating it as unset
    set:
      gateway:
        className: 0
    asserts:
      - failedTemplate:
          errorMessage: 'gateway.className must be a GatewayClass name, got 0'

  - it: rejects a boolean default class rather than treating it as unset
    set:
      gateway:
        className: false
    asserts:
      - failedTemplate:
          errorMessage: 'gateway.className must be a GatewayClass name, got false'

  - it: carries the classes a tenant may select
    set:
      gateway:
        tenantSelectableClasses:
          - cloudflare-tunnel
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-tenant-classes:\s*"cloudflare-tunnel"'

  - it: rejects a non-string entry in gateway.edgeTerminatedClasses
    set:
      gateway:
        edgeTerminatedClasses:
          - 42
    asserts:
      - failedTemplate:
          errorPattern: 'gateway.edgeTerminatedClasses must be a list of GatewayClass names'

  - it: rejects a non-string entry in gateway.tenantSelectableClasses
    set:
      gateway:
        tenantSelectableClasses:
          - 42
    asserts:
      - failedTemplate:
          errorPattern: 'gateway.tenantSelectableClasses must be a list of GatewayClass names'

  - it: rejects a class name carrying a comma, which the channel would split
    set:
      gateway:
        edgeTerminatedClasses:
          - "cloudflare-tunnel,sneaky"
    asserts:
      - failedTemplate:
          errorPattern: 'contains a comma; the list travels comma-joined'

  - it: writes an empty tenant-selectable list by default
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-tenant-classes:\s*""'

  # gateway.isolatedClasses reaches the gateway chart as
  # _cluster.gateway-isolated-classes, where it switches on the
  # cozystack-gateway-isolation CiliumNetworkPolicy for a tenant on that class.
  - it: writes an empty isolated list by default
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-isolated-classes:\s*""'

  - it: carries the isolated classes comma-joined
    set:
      gateway:
        tenantSelectableClasses:
          - envoy-internal
          - other-internal
        isolatedClasses:
          - envoy-internal
          - other-internal
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-isolated-classes:\s*"envoy-internal,other-internal"'

  - it: accepts an isolated class listed padded on either side
    set:
      gateway:
        tenantSelectableClasses:
          - " envoy-internal "
        isolatedClasses:
          - envoy-internal
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-isolated-classes:\s*"envoy-internal"'

  - it: refuses an isolated class that tenants cannot select
    set:
      gateway:
        isolatedClasses:
          - other-internal
    asserts:
      - failedTemplate:
          errorPattern: 'gateway.isolatedClasses entry "other-internal" is not in gateway.tenantSelectableClasses'

  # The default class is where every tenant that chose nothing lands, the
  # publishing one included; the internal class must never be it.
  - it: refuses envoy-internal as the platform default class
    set:
      gateway:
        className: envoy-internal
        tenantSelectableClasses:
          - envoy-internal
        isolatedClasses:
          - envoy-internal
    asserts:
      - failedTemplate:
          errorPattern: 'gateway.className must not be envoy-internal'

  - it: refuses envoy-internal as the default even when padded
    set:
      gateway:
        className: "  envoy-internal  "
    asserts:
      - failedTemplate:
          errorPattern: 'gateway.className must not be envoy-internal'

  - it: accepts envoy-internal listed padded in both lists
    set:
      gateway:
        tenantSelectableClasses:
          - " envoy-internal "
        isolatedClasses:
          - " envoy-internal"
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-isolated-classes:'

  - it: refuses offering envoy-internal to tenants without isolating it
    set:
      gateway:
        tenantSelectableClasses:
          - envoy-internal
    asserts:
      - failedTemplate:
          errorPattern: 'gateway.tenantSelectableClasses lists envoy-internal but gateway.isolatedClasses does not'

  - it: rejects a non-string entry in gateway.isolatedClasses
    set:
      gateway:
        isolatedClasses:
          - 42
    asserts:
      - failedTemplate:
          errorPattern: 'gateway.isolatedClasses must be a list of GatewayClass names'

  - it: rejects an isolated class name carrying a comma
    set:
      gateway:
        isolatedClasses:
          - "envoy-internal,sneaky"
    asserts:
      - failedTemplate:
          errorPattern: 'gateway.isolatedClasses entry "envoy-internal,sneaky" contains a comma'

  # Envoy Gateway's proxies dial the controller by its cluster-domain FQDN, a
  # vendored-subchart value; same channel as keda.clusterDomain.
  - it: injects the cluster domain into the Envoy Gateway subchart
    set:
      networking.clusterDomain: cluster.local
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^\s*gateway-helm:\s*\n\s*kubernetesClusterDomain:\s*"cluster.local"'
